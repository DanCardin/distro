[ids]
*

[main]
# Right Alt → Super/Meta for Niri (the Mod key in niri config)
rightalt = meta

# Win key → mac-cmd layer for app shortcuts
leftmeta = layer(cmd)

# Left Alt → option layer for word/line navigation.
# :A keeps Alt as an active modifier so Alt+Tab, Alt+F4, readline Alt+B etc.
# still pass through for keys not explicitly remapped here.
leftalt = layer(option)

[cmd]
# ── Text editing ─────────────────────────────────────────────────────────────
a = C-a
c = C-c
v = C-v
x = C-x
z = C-z
S-z = C-S-z          # Cmd+Shift+Z = redo

# ── Common app shortcuts ──────────────────────────────────────────────────────
s = C-s              # save
f = C-f              # find
r = C-r              # reload
t = C-t              # new tab
n = C-n              # new window
w = C-w              # close tab
q = C-q              # quit

# ── App switcher ──────────────────────────────────────────────────────────────
tab = A-tab          # Cmd+Tab → Alt+Tab (app switcher)
S-tab = A-S-tab      # Cmd+Shift+Tab → Alt+Shift+Tab (reverse)

# ── Line navigation ───────────────────────────────────────────────────────────
# Cmd+Left/Right = beginning/end of line (Home/End)
left = home
right = end
S-left = S-home      # Cmd+Shift+Left = select to line start
S-right = S-end      # Cmd+Shift+Right = select to line end

# ── Document navigation ───────────────────────────────────────────────────────
# Cmd+Up/Down = document start/end
up = C-home
down = C-end
S-up = C-S-home
S-down = C-S-end

# ── Tab cycling ───────────────────────────────────────────────────────────────
# Cmd+Shift+[ / ] = prev/next tab (browsers, terminals, IDEs)
S-[ = C-S-tab
S-] = C-tab

[option:A]
# ── Word navigation ───────────────────────────────────────────────────────────
# Option+Left/Right = back/forward one word
left = C-left
right = C-right
S-left = C-S-left    # Option+Shift+Left = select word back
S-right = C-S-right  # Option+Shift+Right = select word forward

# ── Word deletion ─────────────────────────────────────────────────────────────
backspace = C-backspace    # Option+Backspace = delete word back
delete = C-delete          # Option+Delete = delete word forward
