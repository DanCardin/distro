[ids]
*

[main]
# Caps Lock → Escape
capslock = escape

# Right Alt → Super/Meta for Niri (the Mod key in niri config)
rightalt = layer(meta)

# Left Alt → mac-cmd layer for app shortcuts
leftalt = layer(cmd)

# Win key → option layer for word/line navigation.
# :A keeps it as an active modifier so shortcuts still pass through.
leftmeta = layer(option)

[cmd]
# ── Text editing ─────────────────────────────────────────────────────────────
a = C-a
c = C-c
v = C-v
x = C-x
z = C-z              # Cmd+Z = undo (Cmd+Shift+Z = redo, handled in cmd+shift layer)

# ── Common app shortcuts ──────────────────────────────────────────────────────
s = C-s              # save
f = C-f              # find
r = C-r              # reload
t = C-t              # new tab
n = C-n              # new window
w = C-w              # close tab
q = C-q              # quit

# ── App switcher ──────────────────────────────────────────────────────────────
tab = A-tab          # Cmd+Tab → Alt+Tab (app switcher)

# ── Line navigation ───────────────────────────────────────────────────────────
# Cmd+Left/Right = beginning/end of line (Home/End)
left = home
right = end

# ── Document navigation ───────────────────────────────────────────────────────
# Cmd+Up/Down = document start/end
up = C-home
down = C-end

[cmd+shift]
z = C-S-z            # Cmd+Shift+Z = redo
tab = A-S-tab        # Cmd+Shift+Tab = reverse app switcher
left = S-home        # Cmd+Shift+Left = select to line start
right = S-end        # Cmd+Shift+Right = select to line end
up = C-S-home        # Cmd+Shift+Up = select to doc start
down = C-S-end       # Cmd+Shift+Down = select to doc end
[ = C-S-tab          # Cmd+Shift+[ = prev tab
] = C-tab            # Cmd+Shift+] = next tab

[option:A]
# ── Word navigation ───────────────────────────────────────────────────────────
# Option+Left/Right = back/forward one word
left = C-left
right = C-right

# ── Word deletion ─────────────────────────────────────────────────────────────
backspace = C-backspace    # Option+Backspace = delete word back
delete = C-delete          # Option+Delete = delete word forward

[option+shift:A]
left = C-S-left      # Option+Shift+Left = select word back
right = C-S-right    # Option+Shift+Right = select word forward
