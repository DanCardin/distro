# XDG Desktop Portal backend routing for Niri.
# xdg-desktop-portal reads this file when XDG_CURRENT_DESKTOP=niri
# (set automatically by niri-session via the DesktopNames= in niri.desktop).
#
# Without this file, portals fall back to autodetection which often picks
# nothing or the wrong backend, causing file pickers, screenshots, and
# screen sharing to silently fail.

[preferred]
# gtk handles: file chooser, colours, email, inhibit, print, secret, settings
default=gtk

# wlr handles screenshare and screenshots via the wlroots screencopy protocol,
# which Niri implements.
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.RemoteDesktop=wlr
