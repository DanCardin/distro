# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: distro
description: framework
base-image: ghcr.io/ublue-os/base-main
image-version: 44

modules:
  # ── Image signing ────────────────────────────────────────────────────────────
  # Sets up cosign policy so rpm-ostree/bootc can verify image integrity.
  - type: signing

  # ── OS identity ──────────────────────────────────────────────────────────────
  - type: os-release
    properties:
      NAME: distro
      VARIANT: framework

  # ── Terra repo (Noctalia) ────────────────────────────────────────────────────
  # Terra is Fyra Labs' repo; it ships noctalia-nightly (v5, native C++).
  # This script follows the official install method (installs terra-release, which
  # sets up the persistent repo file and GPG key).
  - type: script
    scripts:
      - setup-terra.sh

  # ── Packages ─────────────────────────────────────────────────────────────────
  - type: dnf
    repos:
      # RPMFusion free + nonfree: codec support, steam-devices, etc.
      nonfree: rpmfusion
    install:
      packages:
        # ── Compositor ─────────────────────────────────────────────────────────
        - niri
        - xwayland-satellite          # rootless Xwayland for legacy X11 apps

        # ── Noctalia shell ─────────────────────────────────────────────────────
        # v5 nightly: native C++, no QuickShell dependency. Installed via Terra.
        - noctalia-nightly
        - brightnessctl               # laptop backlight control
        - ImageMagick                 # wallpaper processing
        - python3                     # template processing
        - git                         # plugin/update support
        - cliphist                    # clipboard history
        - wlsunset                    # night light / colour temperature

        # ── XDG Desktop Portals ────────────────────────────────────────────────
        # The niri-portals.conf file (deployed below) routes each portal to the right backend.
        - xdg-desktop-portal
        - xdg-desktop-portal-gtk      # file picker, colours, settings, most things
        - xdg-desktop-portal-wlr      # screenshare / screencopy for wlroots compositors

        # ── Display manager ────────────────────────────────────────────────────
        - greetd
        - noctalia-greeter

        # ── Secrets / keyring ──────────────────────────────────────────────────
        # gnome-keyring handles Secret Service API + SSH agent.
        # PAM integration (deployed below) auto-unlocks on greetd login and
        # sets SSH_AUTH_SOCK, replacing the fish-ssh-agent plugin.
        - gnome-keyring
        - libsecret

        # ── Audio ──────────────────────────────────────────────────────────────
        - pipewire
        - pipewire-alsa
        - pipewire-pulseaudio
        - wireplumber
        - pamixer                     # CLI volume control (used by Noctalia OSD)
        - pavucontrol                 # GUI audio mixer for when you need it

        # ── Screenshots ────────────────────────────────────────────────────────
        - grim
        - slurp
        - swappy                      # screenshot annotation

        # ── Wayland utilities ──────────────────────────────────────────────────
        - wl-clipboard                # wl-copy / wl-paste (cliphist + nvim + CLI)
        - playerctl                   # MPRIS media key control
        - swaylock                    # screen locker

        # ── Wayland + Qt compatibility ─────────────────────────────────────────
        - qt5-qtwayland
        - qt6-qtwayland
        - qt5ct                       # Qt5 style config tool
        - qt6ct                       # Qt6 style config tool
        - xdg-utils

        # ── Authentication agent ───────────────────────────────────────────────
        # polkit-gnome registers an XDG autostart entry; niri-session picks it
        # up automatically so GUI sudo prompts work out of the box.
        - polkit
        - xfce-polkit                 # polkit agent for non-GNOME sessions (replaces polkit-gnome on F42)

        # ── Networking ─────────────────────────────────────────────────────────
        - NetworkManager-openvpn
        - NetworkManager-openconnect
        - iwd                         # Intel WiFi daemon (better power mgmt than wpa_supplicant)

        # ── Bluetooth ──────────────────────────────────────────────────────────
        - bluez
        - blueman

        # ── Thunderbolt ────────────────────────────────────────────────────────
        - bolt                        # Thunderbolt device authorization

        # ── Power management ───────────────────────────────────────────────────
        - power-profiles-daemon
        - thermald                    # Intel thermal management daemon
        - upower
        - powerstat

        # ── Intel GPU: Panther Lake (Xe3 iGPU, xe DRM driver) ─────────────────
        - intel-media-driver          # VA-API hardware video decode (iHD)
        - libva-utils                 # `vainfo` to verify VA-API is working
        - mesa-vulkan-drivers         # Vulkan for Intel iGPU (Steam/Proton)
        - vulkan-loader

        # ── Fingerprint reader ─────────────────────────────────────────────────
        - fprintd
        - fprintd-pam                 # PAM module for fingerprint auth at login/sudo

        # ── File management ────────────────────────────────────────────────────
        - thunar
        - thunar-archive-plugin
        - thunar-volman
        - file-roller                 # archive GUI (integrates with thunar-archive-plugin)
        - udisks2                     # removable drive mount daemon

        - gvfs
        - gvfs-mtp                    # Android / MTP devices
        - gvfs-smb                    # Samba / network shares
        - gvfs-gphoto2                # cameras

        # ── Containers ─────────────────────────────────────────────────────────
        - distrobox

        # ── Shell + CLI tools ──────────────────────────────────────────────────
        - fish
        - tmux
        - atuin                       # shell history sync
        - starship                    # shell prompt
        - zoxide                      # smart cd (aliased as m)
        - eza                         # better ls
        - bat                         # better cat / man pager
        - delta                       # better diff / git pager
        - dust                        # better du
        - ripgrep                     # better grep (aliased as ag)
        - fd-find                     # better find
        - fzf                         # fuzzy finder

        # ── System utilities ───────────────────────────────────────────────────
        - just                        # task runner (ublue convention; see justfile)
        - steam-devices               # controller / gamepad udev rules
        - kanshi                      # Wayland display layout daemon (auto-switches on monitor plug/unplug)

        # ── Fonts ──────────────────────────────────────────────────────────────
        - google-noto-fonts-common
        - google-noto-emoji-fonts
        - fontawesome-fonts
        - jetbrains-mono-fonts
        - adobe-source-code-pro-fonts
        # For Nerd Font icon glyphs (used by many shell/bar themes), install
        # via brew post-boot:
        #   brew install --cask font-symbols-only-nerd-font
        #   brew install --cask font-sauce-code-pro-nerd-font  # Source Code Pro + Nerd glyphs

        # ── Icons ──────────────────────────────────────────────────────────────
        - papirus-icon-theme
        - hicolor-icon-theme

  # ── keyd (kernel-level key remapper) ─────────────────────────────────────────
  # Not in standard Fedora repos; requires the alternateved COPR.
  - type: dnf
    repos:
      copr:
        - alternateved/keyd
    install:
      packages:
        - keyd

  # ── Kernel arguments ─────────────────────────────────────────────────────────
  - type: kargs
    kargs:
      # Intel Panther Lake uses s2idle (S0ix / Modern Standby), not S3.
      - mem_sleep_default=s2idle
      # Enable PSR
      - xe.enable_psr=1
      # Disable NMI watchdog — saves power and reduces latency jitter.
      - nowatchdog
      # Enable IOMMU for Thunderbolt security; pt mode avoids overhead on non-DMA regions.
      - intel_iommu=on
      - iommu=pt
      # Clean boot output (errors still shown via journalctl).
      - quiet
      # Prevent chassis shifts/interrupts from waking laptop
      - acpi.ec_no_wakeup=1
      # Bundle RCU callbacks together to let CPU cores drop to deeper C-states
      - rcutree.enable_rcu_lazy=1
# Fixes the VM writeback timeout warning (forces dirty pages to cache longer)
      - vm.dirty_writeback_centisecs=1500
      # Ensures the hardware clock alarm wakes the CPU to execute hibernation transition
      - rtc_cmos.use_acpi_alarm=1

  # ── Flatpaks ─────────────────────────────────────────────────────────────────
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - io.github.zen_browser.zen
          - com.valvesoftware.Steam
          - com.github.tchx84.Flatseal
          - dev.vencord.Vesktop
          - net.davidotek.pupgui2           # ProtonUp-Qt: manage Proton/Wine versions for Steam
          - io.github.celluloid_player.Celluloid  # mpv frontend, Wayland-native
          - com.github.wwmm.easyeffects         # PipeWire audio effects / EQ for speaker tuning

  # ── Homebrew ─────────────────────────────────────────────────────────────────
  - type: brew

  # ── System files ─────────────────────────────────────────────────────────────
  # Deploys everything in files/system/ into /.
  # Includes: startniri launcher, niri default config, niri.desktop session
  # entry, and the portal routing config that fixes popup/file picker issues.
  - type: files
    files:
      - source: system
        destination: /

  # ── Systemd units ────────────────────────────────────────────────────────────
  - type: systemd
    system:
      enabled:
        - greetd
        - power-profiles-daemon
        - thermald
        - bluetooth
        - bolt
        - iwd
        - fprintd
        - keyd
      masked:
        - wpa_supplicant

  # ── Cleanup + initramfs ──────────────────────────────────────────────────────
  - type: script
    scripts:
      - set-default-shell.sh
      - cleanup-repos.sh

  # Regenerate initramfs last — picks up all kernel/dracut changes from above.
  - type: initramfs
